services:
  - type: web
    name: lancerpulse
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn lancerpulse.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
